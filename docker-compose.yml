services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Service (Primary Database)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: amrutam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amrutam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amrutam_password}
      POSTGRES_DB: ${POSTGRES_DB:-amrutam_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amrutam_user} -d ${POSTGRES_DB:-amrutam_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - amrutam-network

  # ----------------------------------------------------------------------------
  # Redis Service (Infrastructure & Cache)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: amrutam-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - amrutam-network

  # ----------------------------------------------------------------------------
  # Amrutam Backend API Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amrutam-backend-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-amrutam_user}:${POSTGRES_PASSWORD:-amrutam_password}@postgres:5432/${POSTGRES_DB:-amrutam_db}?schema=public
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-5000}:5000"
    command: >
      sh -c "npx prisma migrate deploy && node src/server.js"
    networks:
      - amrutam-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  amrutam-network:
    driver: bridge
